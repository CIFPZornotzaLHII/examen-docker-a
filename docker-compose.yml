# Examen Docker · Bloque A
# Este fichero NO funciona tal como está. Arréglalo siguiendo el README.

services:

  # ── No toques este servicio: es el corrector del examen ─────────────────────
  corrector:
    image: python:3.12-alpine
    profiles: ["corrector"]
    command: python /examen/corrector/corregir.py
    volumes:
      - ./:/examen:ro
      - /var/run/docker.sock:/var/run/docker.sock
  # ─────────────────────────────────────────────────────────────────────────────

  wordpress:
    image: wordpress
    restart: always
    ports:
      - 80:8080
    environment:
      WORDPRESS_DB_HOST: localhost
      WORDPRESS_DB_USER: exampleuser
      WORDPRESS_DB_PASSWORD: examplepass
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress:/var/www/html

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: exampledb
      MYSQL_USER: exampleuser
      MYSQL_PASSWORD: examplepas
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    volumes:
      - db:/var/lib/mysql

phpmyadmin:
  image: phpmyadmin
  restart: always
  ports:
    - 8081:8080
  environment:
    PMA_ARBITRARY: '1'

volumes:
  wordpress:
